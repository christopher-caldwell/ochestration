# Copy to orchestrate.providers.toml and edit the model/harness values for your machine.
quorum = "majority"

[[provider]]
name = "codex"
host = "codex"
provider = "deepseek"
model = "deepseek-v4-pro"
model_effort = "high"
interactive = false
command = [
  "codex", "exec", "--skip-git-repo-check",
  "--dangerously-bypass-approvals-and-sandbox",
  "-C", "{workspace}", "--output-last-message", "{log}/last-message.json",
  "{prompt}",
]

[[provider]]
name = "claude"
host = "claude-code"
provider = "anthropic"
model = "claude-sonnet-4-5"
interactive = false
command = ["claude", "-p", "{prompt}", "--add-dir", "{workspace}", "--output-format", "json"]

[[provider]]
name = "cursor"
host = "cursor"
interactive = true
command = ["cursor", "{workspace}"]
