schema_version = 5

[worker]
adapter = "codex"
# Claude Workers automatically get file-edit permission and unattended shell
# execution inside Claude's strict OS sandbox. Sandboxed commands run without
# approval; commands that need unsandboxed execution are not auto-approved.
# Git commits also work in linked worktrees. Review, Audit, and Unblock do not
# receive these defaults. Network access or other external filesystem writes
# may need explicit Claude settings.
# Permission/sandbox args (including --settings) suppress the whole Worker
# baseline; Claude's native args/settings then decide the policy. Include any
# defaults you still need.
# Select a Claude-native model when adapter = "claude"; model names are passed through unchanged.
# Optional provider-native model.
# model = "native-model-name"
# Optional provider-neutral effort. Omit to add no first-class effort setting;
# Orchestrate chooses no default.
# effort = "high"
# Optional opaque provider-native arguments; appended unchanged after any first-class effort.
# These may set effort independently; Orchestrate does not inspect, normalize,
# reconcile, or prevent effort settings in them.
# args = ["--search"]

[reviewer]
adapter = "codex"

# Optional. If omitted, Unblock uses reviewer settings but never its session.
# [unblocker]
# adapter = "codex"
# effort = "high"
