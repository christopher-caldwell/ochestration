[package]
name = "orchestrate"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "orchestrate"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
orchestrate-audit = { path = "../audit" }
orchestrate-investigate = { path = "../investigate" }
orchestrate-build = { path = "../build" }
orchestrate-reconcile = { path = "../reconcile" }
orchestrate-contracts = { path = "../contracts" }
orchestrate-core = { path = "../core" }
orchestrate-discovery = { path = "../discovery" }
orchestrate-guides = { path = "../guides" }
serde_json.workspace = true
serde.workspace = true
serde_yaml.workspace = true
zip = { version = "3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
toml.workspace = true
orchestrate-core = { path = "../core" }
symlink = "0.1.0"

[lints]
workspace = true

[target."cfg(unix)".dependencies]
signal-hook = { version = "0.4", default-features = false }

[target."cfg(unix)".dev-dependencies]
nix = { version = "0.30.1", default-features = false, features = ["signal", "process"] }
